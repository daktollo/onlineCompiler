version: '3.8'
services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - manager
      - mongodb
    networks:
      - batman

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - batman

  manager:
    image: code_manager:runner
    container_name: code_manager
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - batman

  mongodb:
    image: mongo:latest
    container_name: mongo_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - batman


networks:
  batman:
    driver: bridge
    name: batman

volumes:
  mongodb_data:
    driver: local
