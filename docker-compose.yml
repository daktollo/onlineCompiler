version: '3.8'
services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "6600:6600"
    #volumes:
      #- /home/daktollo/SEP/KG/onlineCompiler/backend:/app
    depends_on:
      - manager
      - mongodb
      #- ollama
    networks:
      - batman

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "6610:6610"
    #volumes:
      #- /home/daktollo/SEP/KG/onlineCompiler/frontend:/app
    depends_on:
      - backend
    networks:
      - batman

  manager:
    image: code_manager:runner
    container_name: code_manager
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
      # - ollama
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      #- /home/daktollo/SEP/KG/onlineCompiler/codeManager:/app
    networks:
      - batman

  mongodb:
    image: mongo:latest
    container_name: mongo_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - batman

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11433:11433"
  #   volumes:
  #     - /home/daktollo/SEP/KG/onlineCompiler/ollama/data:/root/.ollama
  #   networks:
  #     - batman
  #   depends_on:
  #     - mongodb
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11433
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

networks:
  batman:
    driver: bridge
    name: batman

volumes:
  ollama_storage:
  mongo_data:

# to build: /usr/bin/bash -lc 'sudo docker build -t code_manager:runner -f codeManager/Dockerfile codeManager && docker build -t block-runner:latest -f codeManager/codeRunner/Dockerfile codeManager/codeRunner && docker compose build && docker compose up -d --force-recreate manager frontend backend && RUNNERS=$(docker ps -q -f name=code_runner_) && if [ -n "$RUNNERS" ]; then docker rm -f $RUNNERS; else echo "No existing code_runner containers"; fi'